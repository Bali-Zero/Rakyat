name: Verifikator live (weekly, read-only)

# Every Friday 11:17 WITA: for the last 7 days of merged PRs, is each one served in production (git ancestry against
# balizero.com/api/health and the backend build_sha), and do its public pages load cleanly on desktop and mobile?
# Read-only: no deploy, no PR comment, no repo write. The one optional write is a Todoist task (TODOIST_API_TOKEN).
# State between runs: verifikator-out/baseline.json (landmarks per route, last observed) travels in actions/cache,
# keyed by ISO week. Sticky: a landmark seen once stays expected (REGRESI every run while it is missing) until
# its entry is removed by hand with the `forget` input of a manual run.
# Never opens kita.balizero.com, my.balizero.com, /portal, /api, /login or (workspace) routes.
on:
  schedule:
    - cron: "17 3 * * 5" # 03:17 UTC = 11:17 WITA, Friday
  workflow_dispatch:
    inputs:
      forget:
        description: 'Baseline entries to remove by hand (sticky baseline): "/route" or "/route#footer", comma-separated'
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  actions: read # fallback: read baseline.json from the previous run's artifact when the cache was evicted

concurrency:
  group: verifikator-live
  cancel-in-progress: false

jobs:
  verifikator:
    name: Verifikator live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ancestry needs full history

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Playwright only, installed out of tree: the workspace's full npm ci is not needed for a read-only probe.
      - name: Install Playwright chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.64.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Baseline cache key (ISO week)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Saved under <week>-<run>-<attempt> so a second run in the same week still saves its own result (cache keys
      # are immutable); restore takes the newest in this week, else the newest overall.
      - name: Restore landmark baseline
        id: baseline
        uses: actions/cache/restore@v6
        with:
          path: verifikator-out/baseline.json
          key: verifikator-baseline-${{ steps.week.outputs.week }}
          restore-keys: |
            verifikator-baseline-${{ steps.week.outputs.week }}-
            verifikator-baseline-

      # GitHub evicts caches not accessed for 7 days, and this job runs every 7 days: a late schedule can find the
      # cache gone. Without a baseline every landmark gap is CATATAN, so a real regression would be downgraded.
      # Fall back to baseline.json inside the newest completed run's evidence artifact (90-day retention).
      - name: Fallback baseline from the last run's artifact
        if: steps.baseline.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow verifikator-live.yml --status completed --limit 5 --json databaseId --jq '.[].databaseId'); do
            rm -rf "$RUNNER_TEMP/prev"
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "verifikator-$id" -D "$RUNNER_TEMP/prev" >/dev/null 2>&1 \
              && [ -f "$RUNNER_TEMP/prev/baseline.json" ]; then
              mkdir -p verifikator-out
              cp "$RUNNER_TEMP/prev/baseline.json" verifikator-out/baseline.json
              echo "baseline.json restored from the artifact of run $id"
              exit 0
            fi
          done
          echo "no previous baseline found: first run, every missing landmark is CATATAN"

      - name: Run verifikator
        env:
          GH_TOKEN: ${{ github.token }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/pw
          VERIFIKATOR_OUT: verifikator-out
          VERIFIKATOR_BASELINE_FORGET: ${{ inputs.forget }}
        run: node scripts/verifikator/run.mjs

      - name: Save landmark baseline
        if: always() && hashFiles('verifikator-out/baseline.json') != ''
        uses: actions/cache/save@v6
        with:
          path: verifikator-out/baseline.json
          key: verifikator-baseline-${{ steps.week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifikator-${{ github.run_id }}
          path: ./verifikator-out
          retention-days: 90
          if-no-files-found: warn
