name: Dependency Review

# Blocks a PR that adds a dependency with a known high or critical advisory,
# before it reaches main. Uses the dependency-graph compare API (no checkout).
# Advisory at first: promoted to a required context in the main-merge-queue
# ruleset only after it has run green on real PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
