name: Detect Secrets

# Rakyat's secret guard on the PR path. Push to main scans the whole tree; a pull
# request scans only the files it changed (merge-base anchored, see
# scripts/ci/hotzone_changed_files.sh). Either way a finding that is not already
# in .secrets.baseline stays unaudited and fails the last step: audit it with
# `detect-secrets audit .secrets.baseline` and commit the label in the same PR.
# Derived from the source repo's security.yml `detect-secrets` job, reduced to
# the scan itself: no corpus suites, no auto-triage, no alert step, no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: detect-secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install detect-secrets
        run: python3 -m pip install detect-secrets==1.5.0

      - name: Decide scan scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "full-tree scan (event: ${EVENT_NAME})"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/ci/hotzone_changed_files.sh "${PR_BASE}" "${PR_HEAD}" "${PR_NUMBER}" > "$RUNNER_TEMP/changed_all.txt"
          : > "$RUNNER_TEMP/changed_existing.txt"
          while IFS= read -r f; do
            [ -f "$f" ] && printf '%s\n' "$f" >> "$RUNNER_TEMP/changed_existing.txt"
          done < "$RUNNER_TEMP/changed_all.txt"
          COUNT=$(wc -l < "$RUNNER_TEMP/changed_existing.txt" | tr -d ' ')
          echo "diff-scope: ${COUNT} scannable file(s) out of $(wc -l < "$RUNNER_TEMP/changed_all.txt" | tr -d ' ') changed"
          if [ "${COUNT}" -eq 0 ]; then
            echo "diff-scope: nothing to scan (empty or deletion-only diff; enumeration succeeded)"
            echo "mode=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=diff" >> "$GITHUB_OUTPUT"

      - name: Run detect-secrets scan
        env:
          SCAN_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "${SCAN_MODE}" = "noop" ]; then
            echo "scan skipped: nothing to scan (see Decide scan scope)"
          elif [ "${SCAN_MODE}" = "diff" ]; then
            FILES=()
            while IFS= read -r f; do
              FILES+=("$f")
            done < "$RUNNER_TEMP/changed_existing.txt"
            detect-secrets scan --baseline .secrets.baseline "${FILES[@]}"
          else
            detect-secrets scan \
              --baseline .secrets.baseline \
              --exclude-files 'node_modules/.*' \
              --exclude-files '\.venv/.*' \
              --exclude-files 'venv/.*' \
              --exclude-files '\.git/.*'
          fi

      - name: Check for unaudited findings
        run: python3 scripts/detect_secrets_check_unaudited.py
